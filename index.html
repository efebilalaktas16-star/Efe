<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>💘</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      overflow: hidden;
    }

    .card {
      background: #020617;
      padding: 32px 24px;
      border-radius: 18px;
      width: min(500px, 90vw);
      box-shadow: 0 30px 70px rgba(0,0,0,.6);
      text-align: center;
    }

    h1 {
      margin: 0 0 30px 0;
      font-size: clamp(24px, 4vw, 32px);
    }

    .arena {
      position: relative;
      height: 220px;
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,.2);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    button {
      font-size: 20px;
      padding: 14px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 700;
      box-shadow: 0 12px 30px rgba(0,0,0,.5);
      user-select: none;
      transition: transform 0.1s;
    }

    .yes {
      background: linear-gradient(180deg, #22c55e, #16a34a);
      color: #052e12;
      z-index: 2;
    }

    .no {
      position: absolute;
      background: linear-gradient(180deg, #ef4444, #dc2626);
      color: white;
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
      z-index: 1;
      transition: left 0.15s ease-out, top 0.15s ease-out; /* Butonun daha akıcı kaçması için */
    }

    .result {
      margin-top: 22px;
      font-size: 22px;
      display: none;
    }

    .result.show {
      display: block;
    }

    .phone {
      margin-top: 10px;
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #22c55e;
    }
  </style>
</head>

<body>
  <div class="card">
    <h1>Efeyle sevgili olmak istiyor musun 🤭🥰</h1>

    <div class="arena" id="arena">
      <button class="yes" id="yesBtn">❤️ Evet ❤️</button>
      <button class="no" id="noBtn">Hayır 😡</button>
    </div>

    <div class="result" id="result">
      💖 O zaman tamam 💖
      <div class="phone">Mesajın gönderiliyor...</div>
    </div>
  </div>

  <script>
    const arena = document.getElementById("arena");
    const noBtn = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");
    const result = document.getElementById("result");

    function moveNo() {
      const a = arena.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const pad = 15;

      const maxX = a.width - b.width - pad;
      const maxY = a.height - b.height - pad;

      const x = pad + Math.random() * maxX;
      const y = pad + Math.random() * maxY;

      noBtn.style.left = x + "px";
      noBtn.style.top = y + "px";
      noBtn.style.transform = "translate(0,0)";
    }

    // Hayır kaçıyor
    noBtn.addEventListener("mouseenter", moveNo);
    noBtn.addEventListener("mousemove", () => {
      if (Math.random() < 0.4) moveNo(); // Kaçma şansını biraz artırdım ;)
    });
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      moveNo();
    }, { passive: false });

    // Evet'e basınca WhatsApp'a uçuş
    yesBtn.addEventListener("click", () => {
      result.classList.add("show");
      
      const phoneNumber = "905378398025";
      const message = encodeURIComponent("seni seviyorum ❤️❤️❤️❤️");
      const whatsappUrl = `https://wa.me/${phoneNumber}?text=${message}`;
      
      // 1 saniye bekleyip sonra yönlendiriyoruz ki sonucu görebilsin
      setTimeout(() => {
        window.location.href = whatsappUrl;
      }, 800);
    });

    moveNo();
    window.addEventListener("resize", moveNo);
  </script>
</body>
</html>
