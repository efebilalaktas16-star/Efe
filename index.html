<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <title>💘</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      overflow: hidden;
    }

    .card {
      background: #020617;
      padding: 32px 24px;
      border-radius: 18px;
      width: min(520px, 92vw);
      box-shadow: 0 30px 70px rgba(0,0,0,.6);
      text-align: center;
    }

    h1 {
      margin: 0 0 26px 0;
      font-size: clamp(20px, 4vw, 28px);
      line-height: 1.3;
    }

    .arena {
      position: relative;
      height: 240px;
      border-radius: 14px;
      border: 1px dashed rgba(255,255,255,.2);
      display: grid;
      place-items: center;
      overflow: hidden;
      touch-action: none;
    }

    button {
      font-size: 20px;
      padding: 14px 22px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      font-weight: 800;
      box-shadow: 0 12px 30px rgba(0,0,0,.5);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .yes {
      background: linear-gradient(180deg, #22c55e, #16a34a);
      color: #052e12;
      position: relative;
      z-index: 3;
    }

    .no {
      position: absolute;
      background: linear-gradient(180deg, #ef4444, #dc2626);
      color: white;
      left: 50%;
      top: 65%;
      transform: translate(-50%, -50%) scale(1);
      z-index: 4;
      transition: left .08s linear, top .08s linear, transform .08s linear;
      will-change: left, top, transform;
    }

    .result {
      margin-top: 22px;
      font-size: 22px;
      display: none;
    }
    .result.show { display: block; }
  </style>
</head>

<body>
  <div class="card">
    <h1>Efeyle (beyaz atlı prensin🧑‍⚖️) sevgili olmak istiyorum</h1>

    <div class="arena" id="arena">
      <button class="yes" id="yesBtn">❤️ Evet ❤️</button>
      <button class="no" id="noBtn">Hayır 😡</button>
    </div>
  </div>

  <script>
    const arena = document.getElementById("arena");
    const noBtn  = document.getElementById("noBtn");
    const yesBtn = document.getElementById("yesBtn");

    let noScale = 1;
    let attempts = 0;

    function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }

    function moveNo(aggressive = false) {
      const a = arena.getBoundingClientRect();
      const b = noBtn.getBoundingClientRect();
      const pad = 10;

      const speedBoost = clamp(attempts * 0.15, 0, 2);
      const jumps = aggressive ? 2 + speedBoost : 1;

      for (let i = 0; i < jumps; i++) {
        const maxX = a.width - b.width - pad;
        const maxY = a.height - b.height - pad;

        const x = pad + Math.random() * Math.max(0, maxX);
        const y = pad + Math.random() * Math.max(0, maxY);

        noBtn.style.left = x + "px";
        noBtn.style.top  = y + "px";
      }

      noBtn.style.transform = `translate(0,0) scale(${noScale})`;
    }

    function shrinkAndRun() {
      attempts++;
      noScale = clamp(1 - attempts * 0.1, 0.35, 1);
      noBtn.style.transform = `translate(0,0) scale(${noScale})`;
      moveNo(true);
    }

    // Mouse ile yaklaşınca KAÇ
    noBtn.addEventListener("mouseenter", () => moveNo(true));
    noBtn.addEventListener("mousemove",  () => moveNo(true));

    // Tıklamaya / dokunmaya çalışınca: KÜÇÜL + DAHA HIZLI KAÇ
    noBtn.addEventListener("mousedown", (e) => {
      e.preventDefault();
      shrinkAndRun();
    });
    noBtn.addEventListener("touchstart", (e) => {
      e.preventDefault();
      shrinkAndRun();
    }, { passive: false });

    // EVET → direkt WhatsApp
    yesBtn.addEventListener("click", () => {
      const phoneNumber = "905378398025";
      const message = encodeURIComponent("seni seviyorum ❤️❤️❤️❤️");
      window.location.href = `https://wa.me/${phoneNumber}?text=${message}`;
    });

    moveNo(true);
    window.addEventListener("resize", () => moveNo(true));
  </script>
</body>
</html>
